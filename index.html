<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GD Clickpack Tester</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect x='2' y='2' width='252' height='252' rx='56' fill='%23fff' stroke='%23d9dce3' stroke-width='4'/%3E%3Cg transform='translate(0,-7)'%3E%3Cpath transform='translate(-8,0)' d='M96 40V136L122 112L142 156L162 147L142 104H176Z' fill='%23000' stroke='%23000' stroke-width='8' stroke-linejoin='round'/%3E%3Cg fill='%23000' transform='translate(1,0)'%3E%3Crect x='48' y='192' width='14' height='20' rx='7'/%3E%3Crect x='72' y='180' width='14' height='44' rx='7'/%3E%3Crect x='96' y='170' width='14' height='64' rx='7'/%3E%3Crect x='120' y='186' width='14' height='32' rx='7'/%3E%3Crect x='144' y='176' width='14' height='52' rx='7'/%3E%3Crect x='168' y='188' width='14' height='28' rx='7'/%3E%3Crect x='192' y='196' width='14' height='12' rx='7'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#16181d;--mut:#6b7280;--acc:#2f7cf6;--bd:#d9dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--mut:#9aa1ae;--acc:#5b9bff;--bd:#2c313b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--mut:#9aa1ae;--acc:#5b9bff;--bd:#2c313b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
button,label.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:.9rem;cursor:pointer;display:inline-block}
button.g{background:transparent;color:var(--text);border:1px solid var(--bd)}
input[type=file]{display:none}
#pad{height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--bd);border-radius:12px;user-select:none;touch-action:none;cursor:pointer;font-size:1.1rem}
#pad.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
#info{color:var(--mut);font-size:.85rem;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.row label{font-size:.85rem;color:var(--mut);display:flex;align-items:center;gap:6px}
input[type=number]{width:64px;padding:5px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--text)}
.grp{margin-top:10px}
.grp h3{font-size:.85rem;margin:0 0 6px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 9px;font-size:.78rem;background:transparent;color:var(--text);border:1px solid var(--bd)}
.chips button:hover{border-color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>GD Clickpack Tester</h1>
<p class="s">Load a clickpack folder, then click the pad or hold Space, W or Up arrow. Nothing is uploaded; it all runs in your browser.</p>

<div class="card">
  <label class="btn">Load folder<input id="dir" type="file" webkitdirectory multiple></label>
  <label class="btn g" style="background:transparent;color:var(--text);border:1px solid var(--bd)">Load files<input id="files" type="file" accept="audio/*" multiple></label>
  <button class="g" id="clear">Clear</button>
  <div id="info">No sounds loaded.</div>
</div>

<div class="card">
  <div id="pad" tabindex="0"><b>Click / hold here</b><span id="last" style="color:var(--mut);font-size:.85rem;margin-top:6px">or press Space / W / Up arrow</span></div>
  <div class="row">
    <label>Volume <input id="vol" type="range" min="0" max="1" step=".01" value=".8"></label>
    <label>Pitch jitter <input id="jit" type="checkbox"></label>
    <label>Spam CPS <input id="cps" type="number" min="1" max="30" value="10"></label>
    <label>Variance % <input id="var" type="number" min="0" max="100" value="0"></label>
    
    <button id="spam">Auto-spam</button>
  </div>
  <div class="row">
    
    <label>Soft &lt; <input id="t2" type="number" step=".01" value=".20">s</label>
    <label>Normal <b id="nr" style="color:var(--text);font-weight:600"></b></label>
    <label>Hard &gt; <input id="t3" type="number" step=".1" value="2">s</label>
  </div>
</div>

<div class="card"><div id="list"><span style="color:var(--mut);font-size:.9rem">Loaded sounds appear here. Click one to preview it.</span></div></div>
</main>
<script>
const AC=new(window.AudioContext||window.webkitAudioContext)();
const gain=AC.createGain();gain.connect(AC.destination);
const $=id=>document.getElementById(id);
const CATS=['soft','normal','hard'];
const mk=()=>({soft:[],normal:[],hard:[]});
let bank={click:mk(),release:mk()};

function classify(path){
  const p=path.toLowerCase();
  const type=p.includes('release')?'release':'click';
  const cat=p.includes('micro')||p.includes('soft')?'soft':p.includes('hard')?'hard':'normal';
  return{type,cat};
}
async function load(fileList){
  await AC.resume();
  const fs=[...fileList].filter(f=>/\.(wav|mp3|ogg|flac|m4a)$/i.test(f.name)||f.type.startsWith('audio'));
  let ok=0,bad=0;
  for(const f of fs){
    try{
      const buf=await AC.decodeAudioData(await f.arrayBuffer());
      const path=f.webkitRelativePath||f.name;
      const {type,cat}=classify(path);
      bank[type][cat].push({name:path.split('/').slice(-2).join('/'),buf});ok++;
    }catch(e){bad++}
  }
  $('info').textContent=`Loaded ${ok} sounds`+(bad?`, ${bad} failed to decode`:'')+'.';
  render();
}
function render(){
  const l=$('list');l.innerHTML='';
  let any=false;
  for(const t of['click','release'])for(const c of CATS){
    const a=bank[t][c];if(!a.length)continue;any=true;
    const g=document.createElement('div');g.className='grp';
    g.innerHTML=`<h3>${t} / ${c} (${a.length})</h3><div class="chips"></div>`;
    a.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>{AC.resume();src(s.buf)};g.lastChild.appendChild(b)});
    l.appendChild(g);
  }
  if(!any)l.innerHTML='<span style="color:var(--mut);font-size:.9rem">Nothing loaded yet.</span>';
}
function src(buf,when=0){
  const s=AC.createBufferSource();s.buffer=buf;
  if($('jit').checked)s.playbackRate.value=1+(Math.random()-.5)*.1;
  s.connect(gain);s.start(when);
}
function pick(type,cat){
  const order=[cat,'normal',...CATS];
  for(const c of order){const a=bank[type][c];if(a.length)return{s:a[Math.floor(Math.random()*a.length)],c}}
  return null;
}
function catFor(sec){
  const t2=+$('t2').value,t3=+$('t3').value;
  return sec<t2?'soft':sec>t3?'hard':'normal';
}
let lastDown=-1e9,downAt=0,held=false;
function down(){
  if(held)return;held=true;
  AC.resume();
  const now=performance.now();
  const cat=catFor((now-lastDown)/1000);
  lastDown=downAt=now;
  $('pad').classList.add('on');
  const r=pick('click',cat);
  if(r){src(r.s.buf);$('last').textContent=`click: ${r.c} (${r.s.name})`}
  else $('last').textContent='No sounds loaded';
}
function up(){
  if(!held)return;held=false;
  $('pad').classList.remove('on');
  const cat=catFor((performance.now()-downAt)/1000);
  const r=pick('release',cat);
  if(r){src(r.s.buf);$('last').textContent+=` | release: ${r.c}`}
}
const pad=$('pad');
pad.addEventListener('pointerdown',e=>{e.preventDefault();down()});
addEventListener('pointerup',up);
const KEYS=['Space','ArrowUp','KeyW'],heldKeys=new Set();
addEventListener('keydown',e=>{if(KEYS.includes(e.code)&&!e.repeat&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();heldKeys.add(e.code);down()}});
addEventListener('keyup',e=>{if(KEYS.includes(e.code)){heldKeys.delete(e.code);if(!heldKeys.size)up()}});
$('vol').oninput=e=>gain.gain.value=+e.target.value;gain.gain.value=.8;
$('dir').onchange=e=>load(e.target.files);
$('files').onchange=e=>load(e.target.files);
$('clear').onclick=()=>{bank={click:mk(),release:mk()};$('info').textContent='No sounds loaded.';render()};
let timer=null;
function spamStep(){
  const base=1000/Math.max(1,+$('cps').value||10),v=Math.min(100,Math.max(0,+$('var').value||0))/100;
  const per=Math.max(15,base*(1+(Math.random()*2-1)*v));
  down();setTimeout(up,per/2);
  timer=setTimeout(spamStep,per);
}
$('spam').onclick=()=>{
  if(timer){clearTimeout(timer);timer=null;$('spam').textContent='Auto-spam';return}
  $('spam').textContent='Stop';spamStep();
};
const SAVE=['vol','jit','cps','var','t2','t3'],KEY='gd-clickpack-tester';
try{
  const o=JSON.parse(localStorage.getItem(KEY)||'{}');
  for(const id of SAVE){if(!(id in o))continue;const el=$(id);if(el.type==='checkbox')el.checked=!!o[id];else el.value=o[id]}
  gain.gain.value=+$('vol').value;
}catch(e){}
function saveOpts(){
  try{const o={};for(const id of SAVE){const el=$(id);o[id]=el.type==='checkbox'?el.checked:el.value}localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
}
for(const id of SAVE)$(id).addEventListener('input',saveOpts);
function updNR(){$('nr').textContent=(+$('t2').value||0)+' to '+(+$('t3').value||0)+' s'}
$('t2').addEventListener('input',updNR);$('t3').addEventListener('input',updNR);updNR();
</script>
</body>
</html>
